<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>联系我们 | 慧邦生物</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<div id="site-nav"></div>
<section class="page-hero"><div class="wrap">
  <div class="en">Contact Us</div><h1>联系我们</h1><p>合作共赢，共同成长</p>
</div></section>
<div class="wrap"><div class="crumb"><a href="index.html">首页</a> / 联系我们</div></div>
<section class="sec" style="padding-top:26px"><div class="wrap">
  <div class="contact-grid" id="cards"></div>
  <div class="cert-card" style="margin-top:30px">
    <h3>联系方式</h3>
    <div id="info"></div>
  </div>
</div></section>
<div id="site-foot"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
ready(function () {
  var c = SITE.company || {};
  document.getElementById('cards').innerHTML = ((SITE.contact || {}).cards || []).map(function (k) {
    return '<div class="ccard"><div class="ico">' + esc(k.icon) + '</div>' +
      '<h4>' + esc(k.title) + '</h4><p>' + esc(k.line1) + '</p>' +
      '<p class="muted">' + (k.line2 || '') + '</p></div>';
  }).join('');

  var rows = [];
  if (c.phone) rows.push('<li><strong>联系电话：</strong>' + esc(c.phone) + '</li>');
  if (c.email) rows.push('<li><strong>电子邮箱：</strong>' + esc(c.email) + '</li>');
  rows.push('<li><strong>公司地址：</strong>' + esc(c.address) + '</li>');

  document.getElementById('info').innerHTML =
    '<ul style="list-style:none;margin:0;padding:0">' + rows.join('') + '</ul>' +
    (c.phone ? '' : '<div class="todo" style="margin-top:16px">联系电话尚未填写。' +
      '登录后台 <code>/admin.html</code> → 公司信息，即可填写电话与邮箱，全站自动生效。</div>');
});
</script>
</body>
</html>
