<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>网站管理后台 | 慧邦生物</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="login-view" style="display:none">
  <form class="login" id="login-form">
    <div class="mark">慧</div>
    <h1>慧邦生物 · 网站管理后台</h1>
    <p class="sub">登录后可修改首页、企业介绍、公司证件、产品目录、企业画册和联系方式</p>
    <div class="msg err" id="login-msg"></div>
    <div class="field"><label>用户名</label><input id="u" autocomplete="username" required></div>
    <div class="field"><label>密码</label><input id="p" type="password" autocomplete="current-password" required></div>
    <button class="btn wide" type="submit" id="login-btn">登 录</button>
  </form>
</div>

<!-- 后台 -->
<div id="admin-view" style="display:none">
  <div class="topbar"><div class="in">
    <div class="mark">慧</div>
    <b>网站管理后台</b>
    <span class="sp"></span>
    <span class="saveinfo" id="saveinfo"></span>
    <a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">查看网站</a>
    <button class="btn ghost sm" id="logout">退出</button>
  </div></div>

  <div class="shell">
    <div class="side" id="side"></div>
    <div class="panel" id="panel"></div>
  </div>

  <div class="savebar">
    <span class="dirty" id="dirty"></span>
    <button class="btn ghost" id="reload">放弃修改</button>
    <button class="btn" id="save">保存并发布</button>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
