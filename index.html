<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>慧邦生物 | 巨野县韦恩生物科技有限公司 · 山东慧邦生物科技有限公司</title>
<meta name="description" content="国家农业部核准的高科技生物环保型农药定点企业，专业从事杀虫剂、杀螨剂、除草剂、杀菌剂、生长调节剂的研发、生产与销售。">
<meta name="keywords" content="慧邦生物,韦恩生物,农药,杀虫剂,杀菌剂,除草剂,杀螨剂,注干剂,松材线虫,菏泽巨野">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
<div id="site-nav"></div>
<div id="page"></div>
<div id="site-foot"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
ready(function () {
  var h = SITE.home, a = SITE.about, c = SITE.certs;

  var html =
  '<section class="hero">' +
    '<img class="bg" src="' + esc(h.heroImage) + '" alt="慧邦生物">' +
    '<div class="wrap">' +
      '<span class="tag">' + esc(h.tag) + '</span>' +
      '<h1>' + esc(h.title) + '<small>' + esc(h.subtitle) + '</small></h1>' +
      '<p class="lead">' + esc(h.lead) + '</p>' +
      '<div class="btns">' +
        '<a class="btn btn-main" href="catalog.html">浏览产品目录</a>' +
        '<a class="btn btn-ghost" href="#about">了解企业</a>' +
      '</div>' +
    '</div>' +
  '</section>' +

  '<section class="stats"><div class="wrap">' +
    (h.stats || []).map(function (s) {
      return '<div><b>' + esc(s.n) + '</b><span>' + esc(s.label) + '</span></div>';
    }).join('') +
  '</div></section>' +

  '<section class="sec" id="about"><div class="wrap">' +
    '<div class="sec-head"><div class="en">Company Introduction</div><h2>企业介绍</h2><div class="bar"></div></div>' +
    '<div class="about-grid">' +
      '<div class="about-txt">' +
        (a.sections || []).map(function (s) {
          return '<h3>' + esc(s.title) + '</h3>' +
            (s.paragraphs || []).map(function (p) { return '<p>' + p + '</p>'; }).join('');
        }).join('') +
      '</div>' +
      '<figure class="about-fig" style="margin:0">' +
        '<img src="' + esc(a.image) + '" alt="企业介绍">' +
        '<figcaption>' + esc(a.imageCaption) + '</figcaption>' +
      '</figure>' +
    '</div>' +
    '<div class="values">' +
      (a.values || []).map(function (v) {
        return '<div class="value"><div class="k">' + esc(v.k) + '</div><div class="v">' + esc(v.v) + '</div></div>';
      }).join('') +
    '</div>' +
  '</div></section>' +

  '<section class="sec soft" id="certs"><div class="wrap">' +
    '<div class="sec-head"><div class="en">Certificates</div><h2>公司证件</h2><div class="bar"></div>' +
      '<p>农业农村部登记在册的农药产品证件</p></div>' +
    '<div class="cert-grid">' +
      '<div class="cert-card"><h3>公司证件</h3><ul>' +
        (c.current || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
      '</ul></div>' +
      '<div class="cert-card"><h3>新登记证件</h3><ul>' +
        (c.registered || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
      '</ul></div>' +
    '</div>' +
    (c.image ? '<figure class="about-fig" style="margin:34px auto 0;max-width:640px">' +
      '<img src="' + esc(c.image) + '" alt="公司证件">' +
      '<figcaption>' + esc(c.imageCaption) + '</figcaption></figure>' : '') +
  '</div></section>' +

  '<section class="sec"><div class="wrap">' +
    '<div class="sec-head"><div class="en">Products</div><h2>产品中心</h2><div class="bar"></div>' +
      '<p>点击分类进入产品目录，目录中每一条均可直达产品详情</p></div>' +
    '<div class="cats">' +
      (SITE.catalog || []).map(function (cat) {
        return '<a class="cat" href="catalog.html#' + esc(cat.id) + '">' +
          '<div class="en">' + esc(cat.en) + '</div>' +
          '<h4>' + esc(cat.name) + '</h4>' +
          '<div class="n">' + (cat.items || []).length + ' 款产品　P' + esc(cat.page) + '</div>' +
        '</a>';
      }).join('') +
    '</div>' +
    '<div style="text-align:center;margin-top:38px">' +
      '<a class="btn btn-green" href="catalog.html">查看完整产品目录 →</a></div>' +
  '</div></section>' +

  '<section class="hero" style="min-height:340px">' +
    '<img class="bg" src="' + esc(h.bannerImage) + '" alt="" style="object-position:center 40%">' +
    '<div class="wrap" style="text-align:center">' +
      '<h1 style="font-size:40px">' + esc(h.bannerTitle) + '</h1>' +
      '<p class="lead" style="margin:14px auto 0">' + esc(h.bannerText) + '</p>' +
    '</div>' +
  '</section>';

  document.getElementById('page').innerHTML = html;
});
</script>
</body>
</html>
